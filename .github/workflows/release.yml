name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The macOS binaries, built on macOS so that they can be signed with the
  # Developer ID and notarized when the repository holds the signing secrets
  # (without them they are built exactly as the build job builds the rest).
  # The build job packs and publishes them.
  darwin-cli:
    runs-on: macos-latest
    env:
      SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: |
          set -eu
          for arch in arm64 amd64; do
            mkdir -p "darwin/$arch"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "darwin/$arch/claudeswitch" ./cmd/claudeswitch
          done
      - name: Developer ID certificate and notary key
        if: env.SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: macos/scripts/ci-keychain.sh
      - name: Sign and notarize
        if: env.SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: macos/scripts/sign-cli.sh darwin/arm64/claudeswitch darwin/amd64/claudeswitch
      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: macos/scripts/ci-keychain.sh --remove
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-cli
          path: darwin/
          if-no-files-found: error

  build:
    needs: darwin-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: darwin-cli
          path: darwin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # Claude Code offers a plugin update only when plugin.json's version
      # changes, so a release that forgets the bump ships new skills nobody
      # receives. Refuse it before anything is built.
      - name: Plugin version matches the tag
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          got="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$got" != "$want" ]; then
            echo "::error::plugin/.claude-plugin/plugin.json is version $got, tag is $want"
            exit 1
          fi
      - name: Build every supported target
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          # Build the archive the same way twice and you get the same bytes.
          # The binary already did: -trimpath and CGO_ENABLED=0 make the Go
          # build reproducible, and re-cutting v0.3.11 proved it — identical
          # binary, different tarball. Both tar and gzip embed modification
          # times, so the envelope changed while the program did not, and every
          # published checksum moved with it.
          #
          # Pinning the times to the tagged commit's own date keeps a rebuild
          # verifiable against what was published: --mtime for the file times,
          # gzip -n for the one gzip writes into its header, and fixed
          # ownership and sort order so the runner's environment cannot leak in
          # either.
          # HEAD, not the tag name: checkout leaves the tagged commit checked
          # out, and a shallow clone need not have the tag ref itself.
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          echo "source date epoch: $SOURCE_DATE_EPOCH"

          # The darwin binaries come from the darwin-cli job (signed, when it
          # could sign: a signature carries its own time, so those two archives
          # are reproducible only unsigned). The artifact drops the mode bits.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            if [ "$os" = darwin ]; then
              echo "packing $os/$arch"
              install -m 0755 "darwin/$arch/claudeswitch" dist/claudeswitch
            else
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "dist/claudeswitch" ./cmd/claudeswitch
            fi
            tar --sort=name --format=gnu \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -cf - -C dist claudeswitch -C .. LICENSE README.md \
              | gzip -n -9 > "dist/claudeswitch_${version}_${os}_${arch}.tar.gz"
            rm dist/claudeswitch
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)

          # Prove it here rather than discovering later that a flag was wrong:
          # rebuild one target and require the bytes to match.
          echo "checking the archive is reproducible"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/claudeswitch" ./cmd/claudeswitch
          tar --sort=name --format=gnu \
            --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            -cf - -C dist claudeswitch -C .. LICENSE README.md \
            | gzip -n -9 > /tmp/recheck.tar.gz
          rm dist/claudeswitch
          a="$(shasum -a 256 < "dist/claudeswitch_${version}_linux_amd64.tar.gz" | cut -d" " -f1)"
          b="$(shasum -a 256 < /tmp/recheck.tar.gz | cut -d" " -f1)"
          if [ "$a" != "$b" ]; then
            echo "::error::the archive is not reproducible: $a vs $b"
            exit 1
          fi
          echo "reproducible: $a"
      # The release's notes are the tag's message (git tag -a), which the
      # app's update window shows as What's new; GitHub's generated list
      # follows it.
      - name: Release notes from the tag
        run: |
          set -eu
          git fetch --force --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true

      # The upload races GitHub making the release discoverable by its tag. On
      # v0.3.11 the action retried, got the four tarballs up, then took a hard
      # 404 on checksums.txt — so the release was published without the file
      # people verify a download against, and the job's failure said nothing
      # about which artifact was missing.
      #
      # So: check what actually landed, put back anything that did not, and
      # fail loudly if it still will not stick. A release missing an artifact
      # should never be a quiet outcome.
      - name: Verify every artifact is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            missing=""
            attached="$(gh release view "$version" --json assets -q '.assets[].name')"
            for f in dist/*; do
              name="$(basename "$f")"
              printf '%s\n' "$attached" | grep -qxF "$name" || missing="$missing $name"
            done
            [ -z "$missing" ] && { echo "all artifacts attached"; exit 0; }
            echo "attempt $attempt: missing$missing"
            for name in $missing; do
              gh release upload "$version" "dist/$name" --clobber || true
            done
            sleep 5
          done
          echo "::error::release $version is still missing:$missing"
          exit 1

  # The menu-bar app, built on macOS and attached to the release the build job
  # created. Signed with the Developer ID, notarized and stapled when the
  # repository holds the signing secrets; without them it is ad-hoc signed and
  # a downloaded copy needs the one-time "Open Anyway" steps.
  macos-app:
    needs: build
    runs-on: macos-latest
    env:
      SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Developer ID certificate and notary key
        if: env.SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: macos/scripts/ci-keychain.sh
      - name: Build the app zip
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          macos/scripts/app-zip.sh dist
          ls -l dist
      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: macos/scripts/ci-keychain.sh --remove
      # Unzip what will be published, mark it downloaded, and ask Gatekeeper
      # what it will tell the person who opens it.
      - name: Gatekeeper accepts the zip
        if: env.SIGNING == 'true'
        run: |
          set -eu
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          ditto -x -k dist/ClaudeSwitch-*-macos.zip "$check"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$check/ClaudeSwitch.app"
          spctl --assess --type execute --verbose=2 "$check/ClaudeSwitch.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || {
            echo "::error::Gatekeeper does not see a notarized Developer ID app"; exit 1; }
      - name: Version matches the tag
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          ls dist/ClaudeSwitch-"$want"-macos.zip >/dev/null || {
            echo "::error::expected dist/ClaudeSwitch-$want-macos.zip"; ls dist; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            gh release upload "$version" dist/ClaudeSwitch-*-macos.zip dist/ClaudeSwitch-*-macos.zip.sha256 --clobber && break || sleep 5
          done
          attached="$(gh release view "$version" --json assets -q '.assets[].name')"
          for f in dist/ClaudeSwitch-*; do
            printf '%s\n' "$attached" | grep -qxF "$(basename "$f")" || {
              echo "::error::release $version is missing $(basename "$f")"; exit 1; }
          done
          echo "app attached"
